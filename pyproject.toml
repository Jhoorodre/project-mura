[project]
name = "mura-cli"
version = "0.1.0"
description = "CLI and TUI automation tool for Project Mura"
authors = [
    { name = "project mura", email = "secular-fox-opium@proton.me" }
]
dependencies = [
    "typer[all]",
    "textual",
    "requests",
    "httpx",
    "GitPython",
    "pyyaml",
]

[project.scripts]
mura = "mura_cli.main:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
